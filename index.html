async function setVote(q,v){
 R[q]=R[q]||{};
 if(v===null||v===undefined)delete R[q][VOTER];else R[q][VOTER]=v;
 render();save();
 if(!DB)return;
 try{await fetch(`${DB}/votes/${q}/${VOTER}.json`,{method:v==null?"DELETE":"PUT",body:JSON.stringify(v)})}catch(e){}
}
async function pull(){
 if(!DB)return;
 try{const r=await fetch(`${DB}/votes.json`);const d=(await r.json())||{};
  if(JSON.stringify(d)!==JSON.stringify(R)){R=d;render()}}catch(e){}
}

function famPanel(){
 $("famH").textContent=t(UI.group);
 $("famBody").innerHTML=TRIP.families.map(f=>`<p style="margin:8px 0"><b>${t(UI.fam)} ${f[0]}</b><br><small>${t(f[1])}</small></p>`).join("")+
 `<hr style="border:0;border-top:1px solid var(--line)"><p><b>${t(UI.total)}</b><br><small>${t(UI.totalSub)}</small></p>`;
}
function header(){
 $("hTitle").textContent=t(UI.title);$("hSub").textContent=t(UI.sub);
 $("hChips").innerHTML=UI.chips.map(c=>`<span class="chip">${t(c)}</span>`).join("");
 $("langBtn").textContent=LANG?"English":"中文";
 document.documentElement.lang=LANG?"zh":"en";document.title=t(UI.title).replace("🍓 ","");
}
function stop(b){
 return `<div class="card h" onclick="this.classList.toggle('open')" style="cursor:pointer">
 <div class="time">${t(b.time)}</div><b>${t(b.title)}</b> ${b.big?`<span class="pill w">${t(b.big)}</span>`:""}
 <div class="m">📍 ${b.loc} · ⏱ ${t(b.dur)}</div>
 <div class="exp"><p>${t(b.notes)}</p>${b.tip?`<div class="tip">💡 ${t(b.tip)}</div>`:""}<span onclick="event.stopPropagation()">${mapBtn(b.loc)}</span></div>
 <small>${t(UI.tap)}</small></div>`;
}
function vote(b){
 return `<h3>${t(b.title)}</h3><div class="opt">`+b.opts.map((o,i)=>{
  const on=mine(b.id)===i;
  return `<div class="card h" style="${on?"border-color:var(--g);border-width:2px":""}">
  <b>${t(o.n)}</b><div class="m">${t(o.style)}</div>
  <p style="margin:6px 0"><span class="pill">👶 ${t(o.kid)}</span><span class="pill e">${t(UI.sug)}</span></p>
  <small><b>${t(UI.why)}</b> ${t(o.why)}</small>
  <div class="row" style="margin-top:10px">${mapBtn(o.n[0])}${vBtn(b.id,i)}</div></div>`;
 }).join("")+`</div><small>${DB?"":t(UI.voteLocal)}${t(UI.voteNote)}</small>`;
}
function route(b){
 const sel=S.sel[b.id]||b.sel;
 let tm=toMin(b.start),lunch=false,rows="",prev=t(UI.breakfast);
 const lunchRow=()=>`<div class="card lunch"><span class="time">${fmt(tm)}</span> 🍽 <b>${t(UI.lunch)}</b> <small>${t(UI.min75)}</small></div>`;
 const cards=b.items.map(a=>{
  const blocked=S.rain&&!a.rain,on=sel.includes(a.id)&&!blocked;
  if(on){
   if(!lunch&&tm>=735){rows+=lunchRow();tm+=75;lunch=true}
   tm+=a.tr;
   rows+=`<div class="m">🚗 ${prev} → ${t(a.n)} · ~${a.tr} ${t(UI.min)} <span class="pill e">${t(UI.estp)}</span></div><div class="card"><span class="time">${fmt(tm)}</span> <b>${t(a.n)}</b> <small>· ${a.dur} ${t(UI.min)}</small></div>`;
   tm+=a.dur;prev=t(a.n);
  }
  return `<div class="card ${on?"":"off"}">
  <div class="row"><label class="ck"><input class="cb" type="checkbox" ${on?"checked":""} ${blocked?"disabled":""} onchange="tog('${b.id}','${a.id}')"><b>${t(a.n)}</b></label>${vBtn("att_"+a.id)}</div>
  ${blocked?`<span class="pill w">${t(UI.skipped)}</span>`:""}
  <div onclick="this.parentNode.classList.toggle('open')" style="cursor:pointer"><span class="pill">${a.s}</span><span class="pill">⏱ ${a.dur} ${t(UI.min)}</span><span class="pill">🚶 ${t(a.walk)}</span> <small>${t(UI.details)}</small></div>
  <div class="exp"><p style="margin:6px 0"><small>${t(UI.f2)}: ${t(a.t2)}<br>${t(UI.f38)}: ${t(a.t38)}<br>${t(UI.trav)} ~${a.tr} ${t(UI.min)} (${t(UI.estp)})<br>${t(a.rain?UI.rainOk:UI.rainNo)}<br>📸 ${t(a.hi)}<br>💰 ${t(a.cost)}<br>${t(a.note)}</small></p>${mapBtn(a.n[0])}</div></div>`;
 }).join("");
 if(!lunch&&rows){rows+=lunchRow();tm+=75}
 rows=rows?rows+`<div class="card"><span class="time">~${fmt(tm)}</span> ${t(UI.back)}</div>`:`<div class="card">${t(UI.none)}</div>`;
 return `<h3>${t(UI.route)}</h3>
 <div class="sw"><button class="${S.rain?"":"on"}" onclick="setRain(false)">${t(UI.good)}</button><button class="${S.rain?"on":""}" onclick="setRain(true)">${t(UI.rain)}</button></div>
 <div class="tip">${t(UI.rainTip)}</div><div class="tl">${rows}</div>
 <h3>${t(UI.pick)}</h3><div class="opt">${cards}</div>`;
}
function check(b){
 const d=b.items.filter((x,i)=>S.chk[b.id+i]).length;
 return `<div class="card" style="border:2px solid var(--r)"><h3 style="margin-top:0;color:var(--r)">${t(b.title)}</h3><small>${t(b.note)}</small>
 <div class="bar" style="margin:8px 0"><i style="width:${d/b.items.length*100}%"></i></div>
 ${b.items.map((x,i)=>`<label class="ck ${S.chk[b.id+i]?"d":""}"><input class="cb" type="checkbox" ${S.chk[b.id+i]?"checked":""} onchange="ck('${b.id+i}')"><span>${t(x)}</span></label>`).join("")}
 <p>${mapBtn(b.loc,UI.mkt)}</p></div>`;
}
function render(){
 header();famPanel();
 const D=TRIP.days[S.day];
 const tabs=TRIP.days.map((d,i)=>`<button class="tab" role="tab" aria-selected="${i===S.day}" onclick="S.day=${i};save();render()"><b>${t(d.tab[0])}</b><span>${t(d.tab[1])}</span></button>`).join("");
 const body=D.blocks.map(b=>b.k==="stop"?stop(b):b.k==="vote"?vote(b):b.k==="route"?route(b):check(b)).join("");
 const pd=TRIP.pack.filter((x,i)=>S.chk["p"+i]).length;
 $("app").innerHTML=`<div class="tabs" role="tablist">${tabs}</div><h2>${t(D.title)}</h2><div class="stack">${body}</div>
 <div class="card" style="margin-top:16px"><h3 style="margin-top:0">${t(UI.pack)} <small>${pd}/${TRIP.pack.length}</small></h3><div class="bar"><i style="width:${pd/TRIP.pack.length*100}%"></i></div>
 ${TRIP.pack.map((x,i)=>`<label class="ck ${S.chk["p"+i]?"d":""}"><input class="cb" type="checkbox" ${S.chk["p"+i]?"checked":""} onchange="ck('p${i}')"><span>${t(x)}</span></label>`).join("")}</div>
 <div class="card" style="margin-top:16px"><h3 style="margin-top:0">${t(UI.notes)}</h3><ul style="margin:0;padding-left:20px">${TRIP.notes.map(n=>`<li>${t(n)}</li>`).join("")}</ul><p><small>${t(UI.est)}</small></p></div>
 <div class="card" style="margin-top:16px"><h3 style="margin-top:0">${t(UI.summary)}</h3>
 <div class="prog">${TRIP.days.map((d,i)=>`<span class="pill ${i<S.day?"":"e"}">${i<S.day?"✓ ":""}${t(d.tab[0]).toUpperCase()}</span>${i<2?"→":""}`).join(" ")}</div>
 <p><b>${t(UI.d[0])}</b> ${t(UI.s1)}<br><b>${t(UI.d[1])}</b> ${t(UI.s2)}<br><b>${t(UI.d[2])}</b> ${t(UI.s3)}</p></div>`;
}

/* ===== 7. ACTIONS ===== */
function tog(r,id){const b=TRIP.days[1].blocks.find(x=>x.id===r);const s=(S.sel[r]||b.sel).slice(),i=s.indexOf(id);i>=0?s.splice(i,1):s.push(id);S.sel[r]=s;save();render()}
function ck(k){S.chk[k]=!S.chk[k];save();render()}
function setRain(r){S.rain=r;save();render()}
function setLang(){LANG=LANG?0:1;try{localStorage.setItem("chl",LANG)}catch(e){}render()}
render();pull();setInterval(pull,8000);
</script></body></html>
